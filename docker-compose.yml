services:
  # =============================================================================
  # 1. FastAPI Analytics & SPC Backend
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PORT=8000
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - lfp-network

  # =============================================================================
  # 2. TanStack Start / React Web Frontend
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - FASTAPI_INTERNAL_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - lfp-network

  # =============================================================================
  # 3. Gateway Reverse Proxy (Unified Single Entry Point for Dokploy / Traefik)
  # Routes:
  #   - /api/*          -> backend:8000
  #   - /docs           -> backend:8000
  #   - /openapi.json   -> backend:8000
  #   - /*              -> frontend:3000
  # =============================================================================
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "80"
      - "3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - lfp-network

networks:
  lfp-network:
    name: lfp-network
    driver: bridge
